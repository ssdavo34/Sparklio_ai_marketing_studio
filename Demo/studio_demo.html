<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Studio - Demo</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        .studio-layout {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            gap: 1rem;
            height: 700px;
        }

        .panel {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
        }

        .canvas-area {
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .canvas-mock {
            width: 400px;
            height: 500px;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .layer-item {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .layer-icon {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            margin-right: 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">Sparklio Studio ✨</div>
            <nav>
                <a href="index.html">홈</a>
                <a href="chat_demo.html">Spark Chat</a>
                <a href="studio_demo.html" class="active">Canvas Studio</a>
                <a href="architecture.html">아키텍처</a>
            </nav>
        </header>

        <section style="margin-bottom: 2rem;">
            <h1>Canvas Studio</h1>
            <p style="color: var(--text-secondary);">Konva.js 기반의 강력한 이미지 편집 환경입니다. 레이어 관리, 속성 편집, 브랜드 키트 연동이 가능합니다.</p>
        </section>

        <div class="studio-layout">
            <!-- Left Panel -->
            <div class="panel">
                <h3 style="font-size: 1rem; margin-bottom: 1rem;">레이어</h3>
                <div class="layer-item" style="background: rgba(59, 130, 246, 0.2);">
                    <div class="layer-icon"></div> 텍스트: "Sale 50%"
                </div>
                <div class="layer-item">
                    <div class="layer-icon"></div> 이미지: Product.png
                </div>
                <div class="layer-item">
                    <div class="layer-icon"></div> 도형: Rectangle
                </div>
                <div class="layer-item">
                    <div class="layer-icon"></div> 배경: Blue Gradient
                </div>
            </div>

            <!-- Center Canvas -->
            <div class="canvas-area">
                <div class="canvas-mock"
                    style="background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); display: flex; justify-content: center; align-items: center; flex-direction: column;">
                    <div
                        style="width: 200px; height: 200px; background: rgba(255,255,255,0.2); border-radius: 12px; margin-bottom: 2rem;">
                    </div>
                    <h1 style="color: white; font-size: 3rem; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">SALE 50%</h1>
                </div>
                <div
                    style="position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.5); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.8rem;">
                    Zoom: 100%
                </div>
            </div>

            <!-- Right Panel -->
            <div class="panel">
                <h3 style="font-size: 1rem; margin-bottom: 1rem;">속성</h3>
                <div style="margin-bottom: 1.5rem;">
                    <label
                        style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">텍스트
                        내용</label>
                    <input type="text" value="SALE 50%" class="input-box" style="padding: 0.5rem;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label
                        style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">폰트
                        크기</label>
                    <input type="range" style="width: 100%;">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label
                        style="display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">색상</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <div
                            style="width: 30px; height: 30px; border-radius: 50%; background: white; border: 2px solid #3b82f6;">
                        </div>
                        <div style="width: 30px; height: 30px; border-radius: 50%; background: #ef4444;"></div>
                        <div style="width: 30px; height: 30px; border-radius: 50%; background: #10b981;"></div>
                    </div>
                </div>
                <button class="btn" style="width: 100%;">적용하기</button>
            </div>
        </div>
    </div>
</body>

</html>
